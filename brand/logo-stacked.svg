<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <title>ArthVani Stacked Logo</title>
  <style>
    .wordmark {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-anchor: middle;
    }
  </style>
  <!-- Mark (72x72 centered at x=44, y=14) -->
  <g transform="translate(44, 14) scale(0.140625)">
    <!-- Speech Bubble -->
    <path d="M 172 102
             L 338 102
             A 76 76 0 0 1 414 178
             L 414 306
             A 76 76 0 0 1 338 382
             L 214 382
             L 156 442
             A 10 10 0 0 1 140 434
             L 140 376
             C 140 342 96 332 96 296
             L 96 178
             A 76 76 0 0 1 172 102 Z"
          fill="none"
          stroke="#2A0E22"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- Rupee Symbol -->
    <line x1="168" y1="166" x2="346" y2="166" stroke="#2A0E22" stroke-width="28" stroke-linecap="round"/>
    <line x1="168" y1="215" x2="346" y2="215" stroke="#2A0E22" stroke-width="28" stroke-linecap="round"/>
    <path d="M 256 166
             C 298 166 298 220 286 240
             C 274 260 230 264 186 264"
          fill="none"
          stroke="#2A0E22"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <line x1="186" y1="264" x2="276" y2="345" stroke="#2A0E22" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="116" class="wordmark">
    <tspan fill="#1A1118">Arth</tspan><tspan fill="#B8336A">Vani</tspan>
  </text>
</svg>

